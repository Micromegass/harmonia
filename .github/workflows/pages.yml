name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (subpath preview)
        run: npm run build && touch build/client/.nojekyll
        env:
          BASE_PATH: /harmonia/
          VITE_SITE_ORIGIN: https://micromegass.github.io/harmonia
          VITE_WHATSAPP_NUMBER: "573001234567"
          VITE_CONTACT_EMAIL: hola@harmoniabaila.example
      - name: Push to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/client
          force_orphan: true
